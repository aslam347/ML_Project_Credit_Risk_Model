name: Deploy Credit Risk Model

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: mohamedaslam2001/credit-risk-model:latest

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key ${EC2_USER}@${EC2_HOST} << 'EOF'
            sudo docker pull mohamedaslam2001/credit-risk-model:latest
            sudo docker stop credit-risk-app || true
            sudo docker rm credit-risk-app || true
            sudo docker run -d -p 8501:8501 --name credit-risk-app mohamedaslam2001/credit-risk-model:latest
          EOF
