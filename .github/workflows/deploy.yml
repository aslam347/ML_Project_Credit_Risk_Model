name: Test, Push to ECR, and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

  deploy-on-ec2:
    needs: build-test-push
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Check Docker disk usage
        run: |
          sudo docker system df

      - name: Free Docker space
        run: |
          sudo docker system prune -af --volumes
          sudo docker system df

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin 325503637305.dkr.ecr.us-east-1.amazonaws.com

      - name: Pull latest image
        run: |
          sudo docker pull 325503637305.dkr.ecr.us-east-1.amazonaws.com/credit-risk-model:latest

      - name: Stop old container
        run: |
          sudo docker stop credit-risk-app || true

      - name: Remove old container
        run: |
          sudo docker rm credit-risk-app || true

      - name: Run new container
        run: |
          sudo docker run -d -p 8501:8501 --name credit-risk-app 325503637305.dkr.ecr.us-east-1.amazonaws.com/credit-risk-model:latest

      - name: Show running containers
        run: |
          sudo docker ps
